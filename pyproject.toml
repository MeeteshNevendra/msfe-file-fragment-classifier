[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msfe-file-fragment-classifier"
version = "0.1.0"
description = "Multi-scale ensemble classifier for fixed-length byte-level file fragments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.15",
]

[project.scripts]
msfe-fragment-classifier = "msfe_fragment_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
